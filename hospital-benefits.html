            const scrollContainerRef = useRef(null);

            // Load and increment visit counter
            useEffect(() => {
                const count = parseInt(localStorage.getItem('hospitalVisitCount') || '0');
                const newCount = count + 1;
                localStorage.setItem('hospitalVisitCount', newCount.toString());
                setVisitCount(newCount);
            }, []);

            const filteredHospitals = hospitalsData.filter(hospital =>
                hospital.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Close modal when clicking backdrop
            const handleBackdropClick = (e) => {
                if (e.target === e.currentTarget) {
                    setSelectedHospital(null);
                }
            };

            // Prevent body scroll when modal is open
            useEffect(() => {
                if (selectedHospital) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'unset';
                }
                return () => {
                    document.body.style.overflow = 'unset';
                };
            }, [selectedHospital]);

            // Check if scroll button should be shown
            const handleScroll = () => {
                if (scrollContainerRef.current) {
                    const { scrollTop, scrollHeight, clientHeight } = scrollContainerRef.current;
                    const isNearBottom = scrollHeight - scrollTop - clientHeight < 50;
                    setShowScrollButton(!isNearBottom && scrollHeight > clientHeight);
                }
            };

            // Scroll to bottom smoothly
            const scrollToBottom = () => {
                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTo({
                        top: scrollContainerRef.current.scrollHeight,
                        behavior: 'smooth'
                    });
                }
            };

            // Reset scroll button when modal opens
            useEffect(() => {
                if (selectedHospital && scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = 0;
                    setTimeout(() => handleScroll(), 100);
                }
            }, [selectedHospital]);

            return (
                <div className="min-h-screen p-3 md:p-6">
                    <div className="max-w-7xl mx-auto">
                        {/* Header - ลด margin */}
                        <div className="text-center mb-6 md:mb-8">
                            <div className="inline-flex items-center justify-center w-14 h-14 md:w-20 md:h-20 bg-white rounded-full shadow-lg mb-3">
                                <svg className="w-7 h-7 md:w-10 md:h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                </svg>
                            </div>
                            <h1 className="text-2xl md:text-4xl font-bold text-gray-800 mb-2">
                                สิทธิประโยชน์โรงพยาบาล
                            </h1>
                            <p className="text-gray-600 text-sm md:text-base">
                                คลิกที่โลโก้โรงพยาบาลเพื่อดูรายละเอียดสิทธิประโยชน์
                            </p>
                        </div>

                        {/* Search Bar - ลด margin */}
                        <div className="mb-6 max-w-2xl mx-auto">
                            <div className="relative">
                                <input
                                    type="text"
                                    placeholder="ค้นหาโรงพยาบาล..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full px-5 py-3 pl-12 text-base rounded-full border-2 border-gray-200 focus:border-blue-500 focus:outline-none shadow-md"
                                />
                                <svg className="w-5 h-5 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                        </div>

                        {/* Hospital Grid - ลด gap และ padding */}
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">
                            {filteredHospitals.map((hospital) => (
                                <button
                                    key={hospital.id}
                                    onClick={() => setSelectedHospital(hospital)}
                                    className="group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1 hover:scale-105"
                                >
                                    {/* ลด padding ภายในกรอบสีฟ้า */}
                                    <div className="bg-gradient-to-br from-blue-600 to-blue-700 aspect-square flex items-center justify-center p-4 relative overflow-hidden">
                                        <div className="absolute inset-0 bg-white/10 transform -skew-y-6 group-hover:skew-y-6 transition-transform duration-500"></div>
                                        <div className="relative z-10 w-full h-full flex items-center justify-center">
                                            {hospital.logo.startsWith('http') || hospital.logo.startsWith('images/') ? (
                                                <img 
                                                    src={hospital.logo} 
                                                    alt={hospital.name}
                                                    className="w-full h-full object-contain p-2"
                                                />
                                            ) : (
                                                <div className="w-16 h-16 md:w-20 md:h-20 bg-white rounded-xl flex items-center justify-center shadow-xl">
                                                    <span className="text-3xl md:text-4xl">🏥</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    {/* ลด padding ด้านล่าง */}
                                    <div className="p-2 md:p-3">
                                        <h3 className="font-semibold text-gray-800 text-[11px] md:text-sm leading-tight line-clamp-2 min-h-[2.2rem]">
                                            {hospital.name}
                                        </h3>
                                    </div>
                                </button>
                            ))}
                        </div>

                        {filteredHospitals.length === 0 && (
                            <div className="text-center py-12">
                                <svg className="w-16 h-16 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <p className="text-gray-500 text-base">ไม่พบโรงพยาบาลที่ค้นหา</p>
                            </div>
                        )}

                        {/* Footer with Counter - ลด margin */}
                        <div className="mt-12 text-center text-gray-500 text-xs md:text-sm pb-6">
                            <div className="mb-3 flex items-center justify-center gap-2">
                                <svg className="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <span className="text-sm font-medium text-gray-700">
                                    เข้าชม: <span className="text-blue-600 font-bold">{visitCount.toLocaleString()}</span> ครั้ง
                                </span>
                            </div>
                            <p>ข้อมูลอัพเดตล่าสุด: มีนาคม 2026</p>
                            <p className="mt-1">รายละเอียดสิทธิประโยชน์อาจมีการเปลี่ยนแปลง กรุณาติดต่อฝ่ายบริการทรัพยากรบุคคล งานบริหารผลประโยชน์และประเมินผล คุณพรรณธิภา (เก๋) โทร. 71116 e-mail: phantipa@nstda.or.th คุณณัฐจิตา (ทราย) โทร. 71138 e-mail: nutjitar@nstda.or.th iService โทร. 1111</p>
                        </div>
                    </div>

                    {/* Modal Popup */}
                    {selectedHospital && (
                        <div 
                            className="modal-backdrop fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-3 md:p-4"
                            onClick={handleBackdropClick}
                        >
                            <div 
                                className="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden relative"
                                onClick={(e) => e.stopPropagation()}
                            >
                                {/* Modal Header - ลด padding */}
                                <div className="bg-gradient-to-r from-blue-600 to-blue-700 p-4 text-white relative">
                                    {/* ปุ่มปิด X */}
                                    <button
                                        onClick={() => setSelectedHospital(null)}
                                        className="absolute top-2 right-2 md:top-3 md:right-3 w-9 h-9 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center transition-colors z-10"
                                        aria-label="ปิด"
                                    >
                                        <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>

                                    <div className="flex items-center gap-3 pr-10">
                                        <div className="w-12 h-12 md:w-14 md:h-14 bg-white rounded-xl flex items-center justify-center shadow-lg flex-shrink-0">
                                            {selectedHospital.logo.startsWith('http') || selectedHospital.logo.startsWith('images/') ? (
                                                <img src={selectedHospital.logo} alt={selectedHospital.name} className="w-9 h-9 md:w-11 md:h-11 object-contain" />
                                            ) : (
                                                <span className="text-2xl md:text-3xl">🏥</span>
                                            )}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <h2 className="text-base md:text-xl font-bold mb-1 line-clamp-2">
                                                {selectedHospital.name}
                                            </h2>
                                            <div className="inline-block bg-white/20 backdrop-blur-sm px-2 py-0.5 rounded-full">
                                                <p className="text-xs font-medium">
                                                    ส่วนลด: {selectedHospital.discount}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Modal Content - ลด padding */}
                                <div 
                                    ref={scrollContainerRef}
                                    onScroll={handleScroll}
                                    className="modal-scroll overflow-y-auto p-4 md:p-5" 
                                    style={{maxHeight: 'calc(90vh - 100px)'}}
                                >
                                    <h3 className="text-sm md:text-lg font-semibold text-gray-800 mb-3 flex items-center gap-2">
                                        <svg className="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                        สิทธิประโยชน์
                                    </h3>

                                    <div className="space-y-2.5">
                                        {selectedHospital.benefits.map((benefit, index) => (
                                            <div
                                                key={index}
                                                className="flex gap-2 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors"
                                            >
                                                <div className="flex-shrink-0 w-1.5 h-1.5 bg-blue-500 rounded-full mt-1.5"></div>
                                                <p className="text-gray-700 leading-relaxed flex-1 text-sm">{benefit}</p>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-5 p-3 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg">
                                        <p className="text-xs text-gray-600 leading-relaxed">
                                            <strong className="text-sm">หมายเหตุ:</strong> กรณีชำระด้วยบัตรเครดิต จะได้รับส่วนลดตามที่บริษัทบัตรเครดิตนั้นๆ ได้ตกลงไว้กับโรงพยาบาล
                                        </p>
                                        <div className="mt-2 text-xs text-gray-600 leading-relaxed">
                                            <p><strong>ผู้ป่วยนอก:</strong> แสดงบัตรประจำตัวพนักงาน</p>
                                            <p className="mt-1"><strong>ผู้ป่วยใน:</strong> แสดงหนังสือส่งตัวของสำนักงาน/บัตรประจำตัวพนักงาน</p>
                                        </div>
                                    </div>
                                </div>

                                {/* ปุ่ม Scroll ลง - วงกลมสีเหลือง */}
                                {showScrollButton && (
                                    <button
                                        onClick={scrollToBottom}
                                        className="bounce-animation absolute bottom-4 left-1/2 transform -translate-x-1/2 w-12 h-12 bg-yellow-400 hover:bg-yellow-500 rounded-full shadow-lg flex items-center justify-center transition-all z-10"
                                        aria-label="เลื่อนลง"
                                    >
                                        <svg className="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                                        </svg>
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
